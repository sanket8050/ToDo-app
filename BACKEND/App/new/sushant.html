<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recepto Leads Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f0f2f5;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dashboard {
      padding: 2rem;
    }
    .lead {
      background: white;
      border-left: 6px solid;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: relative;
    }
    .lead.recepto { border-color: #3498db; }
    .lead.org { border-color: #2ecc71; }
    .lead .score {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-weight: bold;
    }
    .score.low { background: #2ecc71; }
    .score.high { background: #2980b9; }
    .btn {
      margin-top: 0.5rem;
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn.unlock { background: #e67e22; color: white; }
    .btn.assign { background: #8e44ad; color: white; }
    .btn.view { background: #7f8c8d; color: white; }
    .like-dislike {
      margin-top: 0.5rem;
    }
    .like-dislike button {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .assigned {
      margin-top: 0.5rem;
      font-style: italic;
      color: #555;
    }
    .info {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <div><strong>Recepto Dashboard</strong></div>
    <div>Welcome, <span id="userName"></span> (Org: <span id="orgName"></span>)</div>
  </header>

  <div class="dashboard" id="leadContainer"></div>

  <script>
    // Sample users
    const users = {
      alice: { password: '123', org: 'OrgA' },
      bob: { password: '123', org: 'OrgA' },
      charlie: { password: '123', org: 'OrgA' },
      eve: { password: '123', org: 'OrgB' }
    };

    let currentUser, currentOrg;
    loginUser();

    const leads = [
      {
        id: 'r1',
        type: 'recepto',
        score: 78,
        credits: 2
      },
      {
        id: 'r2',
        type: 'recepto',
        score: 92,
        credits: 1
      },
      {
        id: 'o1',
        type: 'org',
        name: 'John Doe',
        tag: '#SaaSProspect',
        viewers: ['alice', 'bob', 'charlie'],
        score: 88,
        credits: 3
      },
      {
        id: 'o2',
        type: 'org',
        name: 'Jane Smith',
        tag: '#MarketingLead',
        viewers: ['alice', 'bob'],
        score: 95,
        credits: 1
      }
    ];

    function loginUser() {
      const savedUser = localStorage.getItem("recepto_user");
      if (savedUser && users[savedUser]) {
        currentUser = savedUser;
        currentOrg = users[savedUser].org;
      } else {
        let user = prompt("Enter username:");
        let pass = prompt("Enter password:");
        if (users[user] && users[user].password === pass) {
          currentUser = user;
          currentOrg = users[user].org;
          localStorage.setItem("recepto_user", user);
        } else {
          alert("Invalid login.");
          location.reload();
        }
      }
      document.getElementById("userName").textContent = currentUser;
      document.getElementById("orgName").textContent = currentOrg;
    }

    function renderLeads() {
      const container = document.getElementById('leadContainer');
      container.innerHTML = '';
      leads.forEach(lead => {
        const div = document.createElement('div');
        div.className = `lead ${lead.type}`;
        div.dataset.id = lead.id;

        const unlocked = localStorage.getItem(`${currentOrg}_${lead.id}_unlocked`);
        const assigned = localStorage.getItem(`${currentOrg}_${lead.id}_assigned`);
        const liked = localStorage.getItem(`${currentOrg}_${lead.id}_liked`);

        // Score display
        const scoreClass = lead.score >= 90 ? 'high' : 'low';
        div.innerHTML += `<div class="score ${scoreClass}">Score: ${lead.score}</div>`;

        if (lead.type === 'recepto') {
          div.innerHTML += `<div class="info"><strong>Name:</strong> [Hidden]</div>`;
          div.innerHTML += `<div class="info"><strong>Source:</strong> ReceptoNet</div>`;
        } else {
          div.innerHTML += `<div class="info"><strong>Name:</strong> ${lead.name}</div>`;
          div.innerHTML += `<div class="info"><strong>Tag:</strong> ${lead.tag}</div>`;
          div.innerHTML += `<div class="info"><strong>Visible to:</strong> ${lead.viewers.join(', ')}</div>`;
        }

        // Like/Dislike
        const likeDiv = document.createElement('div');
        likeDiv.className = "like-dislike";
        likeDiv.innerHTML = `
          <button onclick="likeLead('${lead.id}')">👍</button>
          <button onclick="dislikeLead('${lead.id}')">👎</button>
        `;
        div.appendChild(likeDiv);

        // Unlock
        if (!unlocked) {
          const unlockBtn = document.createElement('button');
          unlockBtn.className = 'btn unlock';
          unlockBtn.textContent = `Unlock Contact (${lead.credits} Credits)`;
          unlockBtn.onclick = () => unlockLead(lead.id);
          div.appendChild(unlockBtn);
        } else {
          const assignBtn = document.createElement('button');
          assignBtn.className = 'btn assign';
          assignBtn.textContent = 'Assign';
          assignBtn.onclick = () => assignLead(lead.id);
          const viewBtn = document.createElement('button');
          viewBtn.className = 'btn view';
          viewBtn.textContent = 'View Details';
          div.appendChild(assignBtn);
          div.appendChild(viewBtn);
        }

        // Assigned Info
        if (assigned) {
          const assignTag = document.createElement('div');
          assignTag.className = 'assigned';
          assignTag.textContent = `Assigned to: ${assigned}`;
          div.appendChild(assignTag);
        }

        container.appendChild(div);
      });
    }

    function unlockLead(id) {
      localStorage.setItem(`${currentOrg}_${id}_unlocked`, "true");
      renderLeads();
    }

    function assignLead(id) {
      const team = ['alice', 'bob', 'charlie'];
      const toAssign = prompt("Assign to (Alice, Bob, Charlie):").toLowerCase();
      if (team.includes(toAssign)) {
        localStorage.setItem(`${currentOrg}_${id}_assigned`, toAssign);
        renderLeads();
      } else {
        alert("Invalid team member.");
      }
    }

    function likeLead(id) {
      localStorage.setItem(`${currentOrg}_${id}_liked`, "like");
      renderLeads();
    }

    function dislikeLead(id) {
      localStorage.setItem(`${currentOrg}_${id}_liked`, "dislike");
      renderLeads();
    }

    renderLeads();
  </script>
</body>
</html>
